# Byte-exact traffic counters for the Apache Balancer Manager dashboard — entirely optional.
#
# Drop this in as a Debian conf snippet:
#
#   sudo install -m 0755 -o root -g root balancer-bytes-agg /usr/local/bin/balancer-bytes-agg
#   sudo install -m 0644 balancer-bytes.conf /etc/apache2/conf-available/balancer-bytes.conf
#   sudo a2enconf balancer-bytes
#   sudo apache2ctl configtest && sudo systemctl restart apache2
#
# then point the BFF at it with "MetricsPath": "/balancer-bytes" for this server.
#
# %I and %O come from mod_logio. Debian's stock "combined" LogFormat already uses %O, so it is
# almost certainly loaded — confirm with: apache2ctl -M | grep logio

LogFormat "%{BALANCER_NAME}e %{BALANCER_WORKER_NAME}e %I %O" balancer_bytes

# env=BALANCER_WORKER_NAME keeps everything that did not go through a balancer out of the pipe:
# mod_proxy_balancer sets that variable only on requests it proxied, so static files and any other
# vhost traffic cost nothing here.
#
# Two things to know about where this line lives:
#  - A <VirtualHost> that declares any CustomLog of its own stops inheriting the server-level ones,
#    so if your proxying vhost has its own access log, move this line inside that vhost. The
#    LogFormat above is still inherited and does not need to be repeated.
#  - Every piped CustomLog spawns its own process, and two aggregators writing the same snapshot
#    would overwrite each other's totals. Keep exactly one of these lines per Apache server, and
#    check it after a restart with: pgrep -af balancer-bytes-agg
CustomLog "|/usr/local/bin/balancer-bytes-agg /run/apache2/balancer-metrics/balancer-bytes.json" balancer_bytes env=BALANCER_WORKER_NAME

# /run is a tmpfs, so the snapshot never touches a disk and is gone on reboot; the aggregator
# recreates its directory whenever Apache starts it.
#
# ProxyPass beats Alias: on a vhost with a catch-all "ProxyPass /", this path is handed to the
# backend and you get its 404 instead of the file. Exclude it there, next to whatever already
# excludes /balancer-manager, with:  ProxyPass /balancer-bytes !
Alias /balancer-bytes /run/apache2/balancer-metrics/balancer-bytes.json

<Directory "/run/apache2/balancer-metrics">
    # Apache denies everything outside the DocumentRoot by default, so the snapshot needs its own
    # grant. Restrict it to the management network the BFF runs on, exactly like /balancer-manager:
    # the snapshot names your backends and how much traffic each one carries.
    Require ip 10.0.0.0/24
</Directory>
