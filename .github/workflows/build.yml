name: Build and Push Docker Image

on:

  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - ".gitignore"

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    # Make the environment-scoped vars/secrets available
    environment: build

    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
    - name: Checkout source code
      uses: actions/checkout@v4

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Set environment variables
      run: |
        echo "GIT_SHORT_SHA=$(echo $GITHUB_SHA | cut -c1-7)" >> $GITHUB_ENV

    # Build the BFF API
    - name: Build Docker image (API)
      run: |
        IMAGE=ghcr.io/apache-balancer-manager-bff
        docker build -t $IMAGE:sha-${GIT_SHORT_SHA} -t $IMAGE:latest -f ApacheBalancerBFF/Dockerfile .
        docker push $IMAGE:sha-${GIT_SHORT_SHA}
        docker push $IMAGE:latest
