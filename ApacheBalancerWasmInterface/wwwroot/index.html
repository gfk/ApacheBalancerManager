<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Apache Balancer Dashboard</title>
    <base href="/" />
    <link rel="preload" id="webassembly" />
    <link rel="stylesheet" href="_content/Radzen.Blazor/css/material-base.css" />
    <link rel="stylesheet" href="css/app.css" />
    <!-- If you add any scoped CSS files, uncomment the following to load them
    <link href="ApacheBalancerWasmInterface.styles.css" rel="stylesheet" /> -->
    <link rel="apple-touch-icon" sizes="512x512" href="icon-512.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="icon-192.png" />
    <script type="importmap"></script>
</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>
    <script src="_content/Radzen.Blazor/Radzen.Blazor.js"></script>
    <script>
        // Pins the notification console to its newest line after each render.
        window.scrollToBottom = function (element) {
            if (element) {
                element.scrollTop = element.scrollHeight;
            }
        };

        // navigator.clipboard is only defined in secure contexts (HTTPS or localhost).
        // The published site is served over plain HTTP, so fall back to the legacy
        // execCommand('copy') path when the modern Clipboard API is unavailable.
        window.copyTextToClipboard = function (text) {
            if (navigator.clipboard && window.isSecureContext) {
                return navigator.clipboard.writeText(text);
            }

            var textArea = document.createElement("textarea");
            textArea.value = text;
            // Keep the element out of view and out of the layout/scroll flow.
            textArea.style.position = "fixed";
            textArea.style.top = "-9999px";
            textArea.style.left = "-9999px";
            document.body.appendChild(textArea);
            textArea.focus();
            textArea.select();
            try {
                if (!document.execCommand("copy")) {
                    throw new Error("execCommand('copy') returned false");
                }
            } finally {
                document.body.removeChild(textArea);
            }
            return Promise.resolve();
        };
    </script>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
</body>

</html>
